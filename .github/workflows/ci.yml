name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - name: Unit, API and CLI end-to-end tests
        run: pytest -v -m "not e2e"
      - name: README images are reproducible
        run: python scripts/build_readme_images.py

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - name: Browser tests (real server + Chromium)
        run: pytest -v -m e2e --tracing retain-on-failure --output test-results
      - name: README screenshots
        run: python scripts/take_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            docs/screenshots/
            test-results/

  build:
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Smoke test the built wheel
        run: |
          pip install "$(ls dist/*.whl)[web]"
          shapeofmovie --help
          shapeofmovie render examples/mean -o /tmp/out --style ring --width 200
          test -f "/tmp/out/Watchmen.ring.png"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shapeofmovie:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name som -p 8000:8000 shapeofmovie:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q "Un film entier"
          docker exec som ffmpeg -version | head -1
          docker rm -f som
