<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="Des films entiers résumés en une seule image de leurs couleurs.">
  <link rel="stylesheet" href="{{ root }}assets/app.css">
  <script src="{{ root }}assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="{{ root or './' }}" class="brand" aria-label="Accueil">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Shape <em>of</em> Movie</span>
    </a>
    <nav>
      <a href="{{ root or './' }}#gallery">Galerie</a>
      <a href="https://github.com/Fyndir/ShapeOfMovie">GitHub</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Shape Of Movie v{{ version }} · version statique, générée avec <code>shapeofmovie site</code> · <a href="https://github.com/Fyndir/ShapeOfMovie">GitHub</a></footer>
</body>
</html>
