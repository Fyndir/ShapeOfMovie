[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shapeofmovie"
version = "2.0.0.dev0"
description = "Summarise a whole movie as a single image of its colours."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
kmeans = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "scikit-learn>=1.3", "ruff>=0.6", "build>=1.2"]

[project.scripts]
shapeofmovie = "shapeofmovie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shapeofmovie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
